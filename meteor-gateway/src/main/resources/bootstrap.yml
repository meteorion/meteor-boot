# Tomcat
server:
  port: 8080
# 日志配置
logging:
  config: classpath:logback-spring.xml
  file:
    path: logs
# Spring
spring:
  application:
    # 应用名称
    name: gateway-server
  profiles:
    # 环境配置
    active: local
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
    sentinel:
      # 取消控制台懒加载
      eager: true
      transport:
        # 控制台地址
        dashboard: 127.0.0.1:8718
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            server-addr: 127.0.0.1:8848
            dataId: sentinel-meteor-cloud-gateway
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow

knife4j:
  # 聚合 Swagger 文档，参考 https://doc.xiaominfo.com/docs/action/springcloud-gateway 文档
  gateway:
    enabled: true
    routes:
      - name: auth-server
        service-name: auth-server
        url: /auth/v3/api-docs
