spring:
  redis:
    host: 127.0.0.1
    port: 6379
  cloud:
    gateway:
      discovery:
        locator:
          lowerCaseServiceId: true
          enabled: true
      routes:
        # 认证中心
        - id: meteor-cloud-auth
          uri: lb://meteor-cloud-auth
          predicates:
            - Path=/auth/**
          filters:
            # 验证码处理
            - CacheRequestFilter
            - ValidateCodeFilter
            - StripPrefix=1
        # 代码生成
        - id: meteor-cloud-module-gen
          uri: lb://meteor-cloud-module-gen
          predicates:
            - Path=/code/**
          filters:
            - StripPrefix=1
        # 定时任务
        - id: meteor-cloud-module-job
          uri: lb://meteor-cloud-module-job
          predicates:
            - Path=/schedule/**
          filters:
            - StripPrefix=1
        # 系统模块
        - id: meteor-cloud-module-system
          uri: lb://meteor-cloud-module-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        # 文件服务
        - id: meteor-cloud-module-file
          uri: lb://meteor-cloud-module-file
          predicates:
            - Path=/file/**
          filters:
            - StripPrefix=1
        # 支付中心
        - id: meteor-cloud-module-pay
          uri: lb://meteor-cloud-module-pay
          predicates:
            - Path=/pay/**
          filters:
            - StripPrefix=1

# 安全配置
security:
  # 验证码
  captcha:
    enabled: true
    type: math
  # 防止XSS攻击
  xss:
    enabled: true
    excludeUrls:
      - /system/notice
  # 不校验白名单
  ignore:
    whites:
      - /auth/logout
      - /auth/login
      - /auth/register
      - /*/v2/api-docs
      - /csrf
      - /file/upload
      - /rule/fire
