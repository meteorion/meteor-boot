spring:
  redis:
    host: 127.0.0.1
    port: 6379
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://example.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          lowerCaseServiceId: true
          enabled: true
      routes:
        # 认证中心
        - id: meteor-auth-api
          uri: lb://auth-server
          predicates:
            - Path=/auth/**,/v3/api-docs/**
          filters:
            # 验证码处理
            - StripPrefix=1
        # 系统模块
        - id: meteor-system-api
          uri: lb://system-server
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        # 支付中心
        - id: meteor-cloud-module-pay
          uri: lb://meteor-cloud-module-pay
          predicates:
            - Path=/pay/**
          filters:
            - StripPrefix=1

# 安全配置
security:
  # 验证码
  captcha:
    enabled: true
    type: math
  # 防止XSS攻击
  xss:
    enabled: true
    excludeUrls:
      - /system/notice
  # 不校验白名单
  ignore:
    whites:
      - /auth/logout
      - /auth/login
      - /auth/register
      - /*/v2/api-docs
      - /csrf
      - /file/upload
      - /rule/fire
