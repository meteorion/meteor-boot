# Tomcat
server:
  port: 9204
# 日志配置
logging:
  config: classpath:logback-nacos.xml
  file:
    path: logs
  level:
    pers.meteor: debug
# Spring
spring:
  application:
    # 应用名称
    name: meteor-cloud-module-pay
  profiles:
    # 环境配置
    active: local
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}

# mybatis配置
mybatis:
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath:mapper/**/*.xml
