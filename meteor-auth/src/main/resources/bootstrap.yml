# Tomcat
server:
  port: 9200
# 日志配置
logging:
  config: classpath:logback-spring.xml
  file:
    path: logs

# Spring
spring:
  application:
    # 应用名称
    name: auth-server
  profiles:
    # 环境配置
    active: local
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  security:
    user:
      name: admin
      password: 123456

meteor:
  web:
    admin-ui:
      url: http://dashboard.yudao.iocoder.cn # Admin 管理后台 UI 的地址
  security:
    auth-user: default
    token:
      enable-jwt: true
      secret: 3f9b8e7c6d5a4f3b2e1c0d9a
