# Tomcat
server:
  port: 8080
# 日志配置
logging:
  config: classpath:logback-spring.xml
  file:
    path: logs
# Spring
spring:
  application:
    # 应用名称
    name: gateway-server
  profiles:
    # 环境配置
    active: local
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://example.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          lowerCaseServiceId: true
          enabled: true
      routes:
        # 认证中心
        - id: meteor-auth-api
          uri: lb://auth-server
          predicates:
            - Path=/auth/**
        # 系统模块
        - id: meteor-system-api
          uri: lb://system-server
          predicates:
            - Path=/system-api/system/**
          filters:
            - RewritePath=/system-server/(?<segment>.*), /$\{segment}
            - StripPrefix=1
        # 支付中心
        - id: meteor-cloud-module-pay
          uri: lb://meteor-cloud-module-pay
          predicates:
            - Path=/pay/**
          filters:
            - StripPrefix=1

knife4j:
  # 聚合 Swagger 文档，参考 https://doc.xiaominfo.com/docs/action/springcloud-gateway 文档
  gateway:
    enabled: true
    routes:
      - name: auth-server
        service-name: auth-server
        url: /auth/v3/api-docs
